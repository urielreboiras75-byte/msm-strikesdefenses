<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSM Strikes & Defenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #0a0f1c;
    --bg-elevated: #0f1626;
    --card: #131c30;
    --card-border: #212d47;
    --text: #e7ecf5;
    --text-muted: #8492ac;
    --accent: #2dd4bf;
    --accent-dim: #14504a;

    --tier-lt2: #64748b;
    --tier-ht2: #c7d4d2;
    --tier-lt1: #8c7c35;
    --tier-ht1: #eab308;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(45, 212, 191, 0.07), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(180, 120, 245, 0.06), transparent 35%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 48px 20px 28px;
  }

  .logo-main {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(40px, 8vw, 68px);
    letter-spacing: 2px;
    line-height: 1.4;
    color: var(--text);
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.5), 0 10px 24px rgba(0, 0, 0, 0.55);
  }

  .logo-sub {
    font-family: 'Press Start 2P', monospace;
    font-size: calc(clamp(40px, 8vw, 68px) * 0.55);
    letter-spacing: 2px;
    line-height: 1.4;
    margin-top: 10px;
    color: transparent;
    -webkit-text-stroke: 1px var(--accent);
    text-stroke: 1px var(--accent);
    text-shadow: 0 0 18px rgba(45, 212, 191, 0.35);
  }

  .tagline {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 10px;
  }

  nav.mode-tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 0 16px 8px;
  }

  .mode-tab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-muted);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  .mode-icon {
    width: 18px;
    height: 18px;
    object-fit: contain;
  }

  .mode-tab:hover {
    color: var(--text);
    border-color: var(--accent-dim);
  }

  .mode-tab.active {
    color: var(--accent);
    background: rgba(45, 212, 191, 0.16);
    border-color: rgba(45, 212, 191, 0.5);
  }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  #status-line {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 12px;
    min-height: 16px;
  }

  .status-legend {
    display: flex;
    justify-content: center;
    max-width: 460px;
    margin: 0 auto 28px;
    border-radius: 6px;
    overflow: hidden;
  }

  .status-legend span {
    flex: 1;
    text-align: center;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  #tiers-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    align-items: start;
  }

  @media (max-width: 900px) {
    #tiers-container { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    #tiers-container { grid-template-columns: 1fr; }
  }

  .tier-column {
    background: var(--bg-elevated);
    border-radius: 10px;
    overflow: hidden;
  }

  .tier-header {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    padding: 14px 16px;
    color: #06201c;
    background: var(--tier-color, var(--accent));
  }

  .player-row {
    position: relative;
    min-height: 108px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: hidden;
  }

  .player-skin-banner {
    position: absolute;
    top: 0;
    right: -6px;
    height: 100%;
    width: auto;
    opacity: 0.24;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to left, black 60%, transparent 100%);
    mask-image: linear-gradient(to left, black 60%, transparent 100%);
    z-index: 0;
  }

  .player-row.status-pending {
    background: rgba(207, 226, 243, 0.04);
  }

  .player-row.status-loa {
    background: rgba(244, 204, 204, 0.04);
  }

  .player-row.status-testing {
    background: rgba(255, 242, 204, 0.04);
  }

  .player-main, .player-meta {
    position: relative;
    z-index: 1;
  }

  .region-tag {
    display: inline-flex;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .player-main {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 21px;
  }

  .peak-badge {
    font-size: 10px;
    font-weight: 700;
    color: #06201c;
    background: var(--tier-color, var(--accent));
    border-radius: 4px;
    padding: 1px 6px;
  }

  .player-meta {
    display: flex;
    gap: 12px;
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .player-id {
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.75;
    margin-top: 4px;
  }

  .empty-row {
    padding: 16px;
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
  }

  .loading, .error {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 0;
    grid-column: 1 / -1;
  }
  .error { color: #f87171; }
</style>
</head>
<body>

<header>
  <div class="logo-main">Mace Submodes</div>
  <div class="logo-sub">Strikes &amp; Defenses</div>
</header>

<nav class="mode-tabs" id="mode-tabs">
  <button class="mode-tab active" data-mode="LT"><img class="mode-icon" src="https://cdn.discordapp.com/emojis/1305399436708544512.webp?size=96" alt="">LT Mace</button>
  <button class="mode-tab" data-mode="HT"><img class="mode-icon" src="https://cdn.discordapp.com/emojis/1537148726638936194.webp?size=96" alt="">HT Mace</button>
  <button class="mode-tab" data-mode="RK"><img class="mode-icon" src="https://cdn.discordapp.com/emojis/1537148662667415553.webp?size=96" alt="">Rocket Mace</button>
  <button class="mode-tab" data-mode="OG"><img class="mode-icon" src="https://cdn.discordapp.com/emojis/1305399676630994994.webp?size=96" alt="">OG Mace</button>
  <button class="mode-tab" data-mode="RD"><img class="mode-icon" src="https://cdn.discordapp.com/emojis/1537148680597938278.webp?size=96" alt="">Rod Mace</button>
  <button class="mode-tab" data-mode="SPM"><img class="mode-icon" src="https://cdn.discordapp.com/emojis/1463390685972660288.webp?size=96" alt="">Spear Mace</button>
</nav>

<main>
  <p id="status-line"></p>
  <div class="status-legend">
    <span style="background:transparent; color:var(--text-muted);">Available</span>
    <span style="background:rgba(255,242,204,0.08); color:#f5dd7a;">Testing</span>
    <span style="background:rgba(244,204,204,0.08); color:#f2a8a8;">LOA</span>
    <span style="background:rgba(207,226,243,0.08); color:#a8cdf2;">Pending</span>
  </div>
  <div id="tiers-container">
    <p class="loading">Loading data...</p>
  </div>
</main>

<script>
  const SHEETS = {
    LT:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=0&single=true&output=csv",
    HT:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=1439486243&single=true&output=csv",
    RK:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=1367025291&single=true&output=csv",
    OG:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=1995941653&single=true&output=csv",
    RD:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=1523377691&single=true&output=csv",
    SPM: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=1180228026&single=true&output=csv"
  };

  const LOA_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=562433624&single=true&output=csv";

  const TIERS = ["LT2", "HT2", "LT1", "HT1"];
  const TIER_COLOR_VARS = {
    LT2: "var(--tier-lt2)",
    HT2: "var(--tier-ht2)",
    LT1: "var(--tier-lt1)",
    HT1: "var(--tier-ht1)"
  };
  const REGION_ORDER = ["NA", "EU", "AS", "SA", "ME", "AU"];
  const REGION_STYLES = {
    NA: { bg: "rgba(88, 48, 62, 0.35)", text: "#f06472" },
    EU: { bg: "rgba(35, 87, 67, 0.35)", text: "#4ade80" },
    AS: { bg: "rgba(72, 59, 106, 0.35)", text: "#c084fc" },
    SA: { bg: "rgba(51, 84, 106, 0.35)", text: "#7dd3fc" },
    ME: { bg: "rgba(91, 82, 33, 0.35)", text: "#facc15" },
    AU: { bg: "rgba(74, 69, 64, 0.35)", text: "#c6a477" }
  };

  let loaSet = new Set();

  async function refreshLOA() {
    try {
      const res = await fetch(LOA_SHEET_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const rows = Papa.parse(text.trim(), { skipEmptyLines: false }).data;
      const newSet = new Set();
      // Columnas: DiscordID, IGN, Inicio, Fin, MarkedFrom, ColoresPrevios
      // Solo cuenta como "en LOA" si tiene IGN y la columna Fin está vacía.
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        const ign = (row[1] || '').trim();
        const fin = (row[3] || '').trim();
        if (ign && !fin) {
          newSet.add(ign.toLowerCase());
        }
      }
      loaSet = newSet;
    } catch (err) {
      console.error('LOA fetch failed', err);
    }
  }

  function regionRank(region) {
    const idx = REGION_ORDER.indexOf((region || '').toUpperCase());
    return idx === -1 ? REGION_ORDER.length : idx;
  }

  const container = document.getElementById('tiers-container');
  const statusLine = document.getElementById('status-line');
  let currentMode = localStorage.getItem('msm_active_mode') || 'LT';
  if (!SHEETS[currentMode]) currentMode = 'LT';

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // Toma el texto CSV crudo de una pestaña y devuelve los jugadores agrupados por tier.
  // Las columnas 0-23 son los 4 bloques (LT2, HT2, LT1, HT1) de 6 columnas cada uno.
  // Se corta al llegar a la fila "Available" (ahí empieza la leyenda/tablas auxiliares).
  // Más abajo en la hoja hay sub-tablas "LT2 Pending" / "HT2 Pending" / "LT1 Pending"
  // (HT1 no tiene) que listan a los jugadores marcados como pending, con su cantidad
  // de strikes en ese momento. Un jugador cuenta como "pending" solo si aparece ahí
  // Y su valor de strikes en esa sub-tabla es negativo.
  function parseSheet(csvText) {
    const rows = Papa.parse(csvText.trim(), { skipEmptyLines: false }).data;
    const result = { LT2: [], HT2: [], LT1: [], HT1: [] };
    let cutoffIndex = rows.length;

    for (let i = 2; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;

      const firstCell = (row[0] || '').trim().toLowerCase();
      if (firstCell === 'available') { cutoffIndex = i; break; }

      TIERS.forEach((tier, idx) => {
        const base = idx * 6;
        const ign = (row[base] || '').trim();
        if (!ign) return;
        result[tier].push({
          ign,
          region: (row[base + 1] || '').trim(),
          strikes: (row[base + 2] || '').trim(),
          defenses: (row[base + 3] || '').trim(),
          discord: (row[base + 4] || '').trim(),
          peak: (row[base + 5] || '').trim(),
          isPending: false
        });
      });
    }

    // Buscar la fila "LT2 | Pending | ... | HT2 | Pending | ... | LT1 | Pending"
    const PENDING_TIERS = ['LT2', 'HT2', 'LT1'];
    let pendingHeaderIdx = -1;
    for (let i = cutoffIndex; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      if ((row[0] || '').trim() === 'LT2' && (row[1] || '').trim().toLowerCase() === 'pending') {
        pendingHeaderIdx = i;
        break;
      }
    }

    if (pendingHeaderIdx !== -1) {
      const pendingSets = { LT2: new Set(), HT2: new Set(), LT1: new Set() };
      // pendingHeaderIdx + 1 es la fila de encabezados (IGN, Region, Strikes...)
      for (let i = pendingHeaderIdx + 2; i < rows.length; i++) {
        const row = rows[i];
        if (!row) break;
        let anyData = false;
        PENDING_TIERS.forEach((tier, idx) => {
          const base = idx * 6;
          const ign = (row[base] || '').trim();
          if (!ign) return;
          anyData = true;
          const strikesNum = parseInt((row[base + 2] || '').trim(), 10);
          if (!isNaN(strikesNum) && strikesNum < 0) {
            pendingSets[tier].add(ign);
          }
        });
        if (!anyData) break;
      }

      PENDING_TIERS.forEach(tier => {
        result[tier].forEach(p => {
          if (pendingSets[tier].has(p.ign)) p.isPending = true;
        });
      });
    }

    // Tabla de "Testing" ubicada siempre en A47:E57 (filas 47 a 57, columna A = IGN).
    const testingSet = new Set();
    for (let i = 46; i <= 56 && i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      const ign = (row[0] || '').trim();
      if (ign) testingSet.add(ign.toLowerCase());
    }
    TIERS.forEach(tier => {
      result[tier].forEach(p => {
        p.isTesting = testingSet.has(p.ign.toLowerCase());
      });
    });

    return result;
  }

  function renderTiers(data) {
    container.innerHTML = '';
    TIERS.forEach(tier => {
      const col = document.createElement('div');
      col.className = 'tier-column';
      col.style.setProperty('--tier-color', TIER_COLOR_VARS[tier]);

      const header = document.createElement('div');
      header.className = 'tier-header';
      header.textContent = tier;
      col.appendChild(header);

      const players = data[tier].slice().sort((a, b) => regionRank(a.region) - regionRank(b.region));
      if (players.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-row';
        empty.textContent = 'No players';
        col.appendChild(empty);
      } else {
        players.forEach(p => {
          const region = (p.region || 'Unknown').toUpperCase();
          const regionStyle = REGION_STYLES[region] || { bg: 'var(--card)', text: 'var(--text-muted)' };
          const isLOA = loaSet.has(p.ign.toLowerCase());
          const row = document.createElement('div');
          row.className = 'player-row' + (p.isPending ? ' status-pending' : '') + (isLOA ? ' status-loa' : '') + (p.isTesting ? ' status-testing' : '');
          row.innerHTML = `
            <img class="player-skin-banner" src="https://vzge.me/bust/400/${encodeURIComponent(p.ign)}" alt="" loading="lazy" onerror="this.remove()">
            <div class="player-main">
              <span>${escapeHtml(p.ign)}</span>
              ${p.peak ? '<span class="peak-badge">PEAK</span>' : ''}
            </div>
            <div class="player-meta">
              <span class="region-tag" style="background:${regionStyle.bg};color:${regionStyle.text};">${escapeHtml(region)}</span>
              <span>${escapeHtml(p.strikes || '0 / 8')} strikes</span>
              <span>${escapeHtml(p.defenses || '0')} def</span>
            </div>
            ${p.discord ? `<div class="player-id">ID: ${escapeHtml(p.discord)}</div>` : ''}
          `;
          col.appendChild(row);
        });
      }

      container.appendChild(col);
    });
  }

  async function fetchModeData(modeKey) {
    const res = await fetch(SHEETS[modeKey], { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    return parseSheet(text);
  }

  async function loadMode(modeKey) {
    currentMode = modeKey;
    container.innerHTML = '<p class="loading">Loading data...</p>';
    statusLine.textContent = '';
    try {
      const data = await fetchModeData(modeKey);
      renderTiers(data);
      statusLine.textContent = 'Last updated: ' + new Date().toLocaleTimeString('en-US');
    } catch (err) {
      container.innerHTML = '<p class="error">Couldn\'t load the data. Please try again in a moment.</p>';
      statusLine.textContent = '';
      console.error(err);
    }
  }

  // Refresco silencioso: actualiza los datos sobre la marcha, sin borrar
  // la pantalla ni mostrar el estado de "Loading..." (para que no parpadee).
  async function refreshCurrentMode() {
    try {
      const data = await fetchModeData(currentMode);
      renderTiers(data);
      statusLine.textContent = 'Last updated: ' + new Date().toLocaleTimeString('en-US');
    } catch (err) {
      console.error(err);
    }
  }

  document.querySelectorAll('.mode-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      localStorage.setItem('msm_active_mode', btn.dataset.mode);
      loadMode(btn.dataset.mode);
    });
  });

  // Marcar como activo el tab del modo restaurado (por si no es LT Mace).
  document.querySelectorAll('.mode-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === currentMode);
  });

  (async function init() {
    await refreshLOA();
    loadMode(currentMode);
  })();

  // Refresca los datos (y la lista de LOA) solos cada 60 segundos para que se
  // vea "en vivo", sin parpadear la pantalla completa.
  setInterval(() => {
    refreshLOA();
    refreshCurrentMode();
  }, 60000);
</script>

</body>
</html>
