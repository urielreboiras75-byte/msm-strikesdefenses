<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSM Strikes & Defenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>

  :root {
    --bg: #f3f4f6;
    --bg-top: #f8f9fb;
    --surface: #ffffff;
    --surface-soft: #f7f8fa;
    --surface-hover: #f0f2f5;
    --border: #e0e3e8;
    --border-strong: #cfd4dc;
    --text: #181b22;
    --text-secondary: #4d5562;
    --text-muted: #727b89;
    --accent: #7558e8;
    --accent-strong: #6040d6;
    --accent-soft: #eeeaff;
    --accent-line: #c9bbff;

    --tier-lt2: #667085;
    --tier-ht2: #657c97;
    --tier-lt1: #9a7a22;
    --tier-ht1: #a87900;

    --status-testing: #9b7610;
    --status-loa: #bd5d5d;
    --status-pending: #4f789d;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-pill: 999px;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg);
    color-scheme: light;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background:
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 38%, var(--bg) 100%);
    color: var(--text);
    font-family: "Outfit", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: 0.34;
    background-image:
      linear-gradient(rgba(25, 32, 43, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25, 32, 43, 0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black, transparent 72%);
  }

  .bg-fx {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -2;
    pointer-events: none;
  }

  .bg-fx .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(95px);
    opacity: 0.8;
  }

  .bg-fx .blob-1 {
    width: 460px;
    height: 460px;
    top: -20%;
    left: -14%;
    background: radial-gradient(circle, rgba(117, 88, 232, 0.10), transparent 68%);
  }

  .bg-fx .blob-2 {
    width: 540px;
    height: 540px;
    right: -18%;
    bottom: -24%;
    background: radial-gradient(circle, rgba(42, 51, 65, 0.065), transparent 68%);
  }

  header {
    width: min(1320px, calc(100% - 40px));
    margin: 0 auto;
    padding: 34px 0 22px;
  }

  .site-icon {
    width: 46px;
    height: 46px;
    margin-bottom: 20px;
    border-radius: 13px;
    overflow: hidden;
    display: inline-block;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    box-shadow: 0 7px 18px rgba(38, 44, 56, 0.09);
    transition: transform 170ms var(--ease-out), border-color 170ms ease, box-shadow 170ms ease;
  }

  .site-icon img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .site-icon:hover {
    transform: translateY(-1px) scale(1.015);
    border-color: var(--accent-line);
    box-shadow: 0 10px 24px rgba(38, 44, 56, 0.12);
  }

  .logo-sub {
    width: fit-content;
    font-size: clamp(34px, 5vw, 54px);
    line-height: 0.98;
    letter-spacing: -0.055em;
    font-weight: 750;
    color: var(--text);
  }

  .logo-sub::after {
    content: "";
    display: block;
    width: 46px;
    height: 4px;
    margin-top: 17px;
    border-radius: var(--radius-pill);
    background: var(--accent);
  }

  nav.mode-tabs {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: flex-start;
    gap: 3px;
    width: min(1320px, calc(100% - 40px));
    margin: 0 auto;
    padding: 8px 0 0;
    overflow-x: auto;
    scrollbar-width: none;
    background: rgba(243, 244, 246, 0.88);
    backdrop-filter: blur(16px) saturate(115%);
    -webkit-backdrop-filter: blur(16px) saturate(115%);
    border-bottom: 1px solid var(--border);
  }

  nav.mode-tabs::-webkit-scrollbar { display: none; }

  .mode-tab {
    position: relative;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 42px;
    padding: 8px 14px 11px;
    border: 0;
    border-radius: 10px 10px 0 0;
    color: var(--text-muted);
    background: transparent;
    font: 650 13px/1 "Outfit", ui-sans-serif, system-ui, sans-serif;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: color 170ms ease, background 170ms var(--ease-out), transform 120ms ease;
  }

  .mode-tab::after {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: -1px;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: transparent;
    transform: scaleX(0.55);
    transform-origin: center;
    transition: transform 220ms var(--ease-out), background 170ms ease;
  }

  .mode-icon {
    width: 18px;
    height: 18px;
    object-fit: contain;
    opacity: 0.58;
    transition: opacity 170ms ease, transform 180ms var(--ease-out);
  }

  .mode-tab:hover {
    color: var(--text);
    background: rgba(255,255,255,0.56);
  }

  .mode-tab:hover .mode-icon {
    opacity: 0.88;
    transform: translateY(-1px) scale(1.04);
  }

  .mode-tab.active {
    color: var(--accent-strong);
    background: rgba(255,255,255,0.72);
  }

  .mode-tab.active::after {
    background: var(--accent);
    transform: scaleX(1);
  }

  .mode-tab.active .mode-icon { opacity: 1; }
  .mode-tab:active { transform: scale(0.985); }

  main {
    width: min(1320px, calc(100% - 40px));
    margin: 0 auto;
    padding: 26px 0 74px;
  }

  .section-divider { display: none; }

  .status-legend {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    margin: 0 0 22px;
    padding: 0 2px 14px;
    border-bottom: 1px solid var(--border);
  }

  .status-legend span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
    padding: 0;
    border-radius: 0;
    background: transparent !important;
    color: var(--text-secondary) !important;
    font-size: 11px;
    line-height: 1.3;
    font-weight: 600;
    white-space: nowrap;
  }

  .status-legend span::before {
    content: "";
    width: 7px;
    height: 7px;
    flex: 0 0 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .status-legend span:nth-child(1) { color: #6f7887 !important; }
  .status-legend span:nth-child(2) { color: var(--status-testing) !important; }
  .status-legend span:nth-child(3) { color: var(--status-loa) !important; }
  .status-legend span:nth-child(4) { color: var(--status-pending) !important; }

  #tiers-container {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }

  .tier-column {
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--surface);
    box-shadow: 0 5px 16px rgba(35, 42, 51, 0.045);
    transition: border-color 180ms ease, box-shadow 220ms var(--ease-out), transform 220ms var(--ease-out);
  }

  .tier-column:hover {
    border-color: #d1d5dc;
    box-shadow: 0 10px 24px rgba(35, 42, 51, 0.075);
    transform: translateY(-1px);
  }

  .tier-header {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 60px;
    padding: 0 16px 0 20px;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    background: linear-gradient(180deg, color-mix(in srgb, var(--tier-color, var(--accent)) 8%, white), white);
    font-size: 14px;
    line-height: 1;
    font-weight: 760;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .tier-header::before {
    content: "";
    width: 4px;
    height: 24px;
    margin-right: 10px;
    border-radius: 3px;
    background: var(--tier-color, var(--accent));
  }

  .tier-header::after {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: color-mix(in srgb, var(--tier-color, var(--accent)) 42%, white);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.11em;
  }

  .tier-column:nth-child(1) .tier-header::after { content: "01"; }
  .tier-column:nth-child(2) .tier-header::after { content: "02"; }
  .tier-column:nth-child(3) .tier-header::after { content: "03"; }
  .tier-column:nth-child(4) .tier-header::after { content: "04"; }

  .player-row {
    position: relative;
    isolation: isolate;
    min-height: 86px;
    padding: 14px 16px 13px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid #eceef2;
    border-left: 3px solid transparent;
    background: transparent;
    transition: background 160ms ease, transform 170ms var(--ease-out), border-color 160ms ease;
  }

  .player-row:last-child { border-bottom: 0; }

  .player-row:hover {
    z-index: 2;
    background: var(--surface-hover);
    transform: translateX(2px);
  }

  .player-row.status-pending { border-left-color: rgba(79, 120, 157, 0.72); }
  .player-row.status-loa { border-left-color: rgba(189, 93, 93, 0.72); }
  .player-row.status-testing { border-left-color: rgba(155, 118, 16, 0.74); }

  .player-skin-banner {
    position: absolute;
    top: 0;
    right: -6px;
    height: 100%;
    width: auto;
    max-width: 60%;
    opacity: 0.09;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to left, black 15%, rgba(0,0,0,0.56) 44%, transparent 100%);
    mask-image: linear-gradient(to left, black 15%, rgba(0,0,0,0.56) 44%, transparent 100%);
    filter: saturate(0.72) contrast(1.03);
    transform: translateZ(0);
    transition: opacity 180ms ease, transform 220ms var(--ease-out);
    z-index: -1;
  }

  .player-row:hover .player-skin-banner {
    opacity: 0.145;
    transform: scale(1.025) translate3d(-2px, 0, 0);
  }

  .player-main,
  .player-meta,
  .player-id {
    position: relative;
    z-index: 1;
  }

  .player-main {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 8px;
    font-weight: 690;
    font-size: 16px;
    line-height: 1.22;
    letter-spacing: -0.02em;
  }

  .player-main span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .region-tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 7px;
    border-radius: var(--radius-pill);
    font-size: 9px;
    line-height: 1;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    border: 1px solid rgba(20, 25, 32, 0.06);
  }

  .peak-badge {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    min-height: 18px;
    padding: 3px 6px;
    border: 1px solid rgba(154,122,34,0.20);
    border-radius: 6px;
    color: #896b10;
    background: #faf5df;
    font-size: 8px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.08em;
  }

  .player-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    color: var(--text-secondary);
    font-size: 10px;
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
  }

  .player-id {
    margin-top: 7px;
    color: #8b93a0;
    font-size: 8px;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-row {
    padding: 28px 16px;
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
  }

  .loading,
  .error {
    grid-column: 1 / -1;
    margin: 0;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--surface);
    min-height: 290px;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    box-shadow: 0 5px 16px rgba(35, 42, 51, 0.045);
  }

  .loading {
    position: relative;
    overflow: hidden;
    color: transparent;
  }

  .loading::before {
    content: "";
    position: absolute;
    inset: 22px;
    border-radius: 12px;
    opacity: 0.7;
    background:
      linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.76) 38%, transparent 62%) 0 0 / 220% 100%,
      linear-gradient(#f0f2f5, #f0f2f5) 0 0 / 100% 56px,
      repeating-linear-gradient(to bottom, #f4f5f7 0 1px, transparent 1px 60px);
    animation: shimmer 1.45s linear infinite;
  }

  @keyframes shimmer {
    from { background-position: -160% 0, 0 0, 0 0; }
    to   { background-position: 160% 0, 0 0, 0 0; }
  }

  .error {
    color: #a44949;
    border-color: #e7c9c9;
    background: #fffafa;
  }

  #status-line {
    width: min(1320px, calc(100% - 40px));
    margin: 0 auto;
    padding: 0 0 30px;
    color: var(--text-muted);
    text-align: right;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.015em;
  }

  .mode-tab:focus-visible,
  .site-icon:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (max-width: 1100px) {
    #tiers-container { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 720px) {
    header {
      width: calc(100% - 24px);
      padding: 24px 0 18px;
    }

    .site-icon {
      width: 42px;
      height: 42px;
      margin-bottom: 16px;
      border-radius: 12px;
    }

    .logo-sub { font-size: clamp(32px, 10vw, 45px); }

    nav.mode-tabs {
      width: calc(100% - 16px);
      padding-top: 6px;
    }

    .mode-tab {
      min-height: 40px;
      padding: 8px 12px 10px;
      font-size: 12px;
    }

    main {
      width: calc(100% - 24px);
      padding-top: 20px;
      padding-bottom: 52px;
    }

    .status-legend {
      gap: 13px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .status-legend::-webkit-scrollbar { display: none; }

    #tiers-container { grid-template-columns: 1fr; }

    #status-line {
      width: calc(100% - 24px);
      text-align: left;
      padding-bottom: 22px;
    }
  }

  @media (max-width: 560px) {
    .tier-header { min-height: 54px; }

    .player-row {
      min-height: 78px;
      padding: 13px 14px 12px;
    }

    .player-main { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c20;
      --bg-top: #202329;
      --surface: #24272d;
      --surface-soft: #202329;
      --surface-hover: #2b2f36;
      --border: #353942;
      --border-strong: #454a55;
      --text: #f2f3f5;
      --text-secondary: #c0c4cd;
      --text-muted: #8f96a3;
      --accent: #a895ff;
      --accent-strong: #c1b4ff;
      --accent-soft: #302b45;
      --accent-line: #7566bc;
    }

    html { color-scheme: dark; }

    body {
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 38%, var(--bg) 100%);
    }

    body::before {
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    }

    .bg-fx .blob-1 { background: radial-gradient(circle, rgba(168, 149, 255, 0.13), transparent 68%); }
    .bg-fx .blob-2 { background: radial-gradient(circle, rgba(255,255,255,0.045), transparent 68%); }

    nav.mode-tabs {
      background: rgba(26, 28, 32, 0.86);
      border-color: var(--border);
    }

    .mode-tab:hover { background: rgba(255,255,255,0.045); }
    .mode-tab.active { background: rgba(255,255,255,0.045); }

    .status-legend,
    .tier-column,
    .loading { border-color: var(--border); }

    .tier-column {
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
    }

    .tier-column:hover { border-color: var(--border-strong); }

    .tier-header {
      color: var(--text);
      background: linear-gradient(180deg, color-mix(in srgb, var(--tier-color, var(--accent)) 10%, #24272d), #24272d);
    }

    .player-row { border-bottom-color: var(--border); }
    .player-row:hover { background: var(--surface-hover); }

    .player-id { color: #777f8e; }
    .peak-badge { color: #d8bd69; background: rgba(216,189,105,0.09); }

    .loading {
      background: var(--surface);
    }

    .loading::before {
      opacity: 0.42;
      background:
        linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 38%, transparent 62%) 0 0 / 220% 100%,
        linear-gradient(rgba(255,255,255,0.055), rgba(255,255,255,0.055)) 0 0 / 100% 56px,
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0 1px, transparent 1px 60px);
    }

    .error {
      color: #e3a0a0;
      border-color: #704d50;
      background: #2a2224;
    }
  }
</style>
</head>
<body>

<div class="bg-fx" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

    OG:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=1995941653&single=true&output=csv",
    RD:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=1523377691&single=true&output=csv",
    SPM: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=1180228026&single=true&output=csv"
  };

  const LOA_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbVTBEHcvVLldMXIilLqUS-BURqM7OwFZZopsaHYAesAB_dOWEW85FkJMYmgmKYBLWs8D40m-UeZjl/pub?gid=562433624&single=true&output=csv";

  const TIERS = ["LT2", "HT2", "LT1", "HT1"];
  const TIER_COLOR_VARS = {
    LT2: "var(--tier-lt2)",
    HT2: "var(--tier-ht2)",
    LT1: "var(--tier-lt1)",
    HT1: "var(--tier-ht1)"
  };
  const REGION_ORDER = ["NA", "EU", "AS", "SA", "ME", "AU"];
  const REGION_STYLES = {
    NA: { bg: "rgba(88, 48, 62, 0.35)", text: "#f06472" },
    EU: { bg: "rgba(35, 87, 67, 0.35)", text: "#4ade80" },
    AS: { bg: "rgba(72, 59, 106, 0.35)", text: "#c084fc" },
    SA: { bg: "rgba(51, 84, 106, 0.35)", text: "#7dd3fc" },
    ME: { bg: "rgba(91, 82, 33, 0.35)", text: "#facc15" },
    AU: { bg: "rgba(74, 69, 64, 0.35)", text: "#c6a477" }
  };

  let loaSet = new Set();

  async function refreshLOA() {
    try {
      const res = await fetch(LOA_SHEET_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const rows = Papa.parse(text.trim(), { skipEmptyLines: false }).data;
      const newSet = new Set();
      // Columnas: DiscordID, IGN, Inicio, Fin, MarkedFrom, ColoresPrevios
      // Solo cuenta como "en LOA" si tiene IGN y la columna Fin está vacía.
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        const ign = (row[1] || '').trim();
        const fin = (row[3] || '').trim();
        if (ign && !fin) {
          newSet.add(ign.toLowerCase());
        }
      }
      loaSet = newSet;
    } catch (err) {
      console.error('LOA fetch failed', err);
    }
  }

  function regionRank(region) {
    const idx = REGION_ORDER.indexOf((region || '').toUpperCase());
    return idx === -1 ? REGION_ORDER.length : idx;
  }

  // Hash simple y estable de un string (no cambia entre refrescos), usado
  // para dar un orden "al azar" pero consistente a los jugadores sin prioridad.
  function simpleHash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    }
    return hash;
  }

  const container = document.getElementById('tiers-container');
  const statusLine = document.getElementById('status-line');
  let currentMode = localStorage.getItem('msm_active_mode') || 'LT';
  if (!SHEETS[currentMode]) currentMode = 'LT';

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // Toma el texto CSV crudo de una pestaña y devuelve los jugadores agrupados por tier.
  // Las columnas 0-23 son los 4 bloques (LT2, HT2, LT1, HT1) de 6 columnas cada uno.
  // Se corta al llegar a la fila "Available" (ahí empieza la leyenda/tablas auxiliares).
  // Más abajo en la hoja hay sub-tablas "LT2 Pending" / "HT2 Pending" / "LT1 Pending"
  // (HT1 no tiene) que listan a los jugadores marcados como pending, con su cantidad
  // de strikes en ese momento. Un jugador cuenta como "pending" solo si aparece ahí
  // Y su valor de strikes en esa sub-tabla es negativo.
  function parseSheet(csvText) {
    const rows = Papa.parse(csvText.trim(), { skipEmptyLines: false }).data;
    const result = { LT2: [], HT2: [], LT1: [], HT1: [] };
    let cutoffIndex = rows.length;

    for (let i = 2; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;

      const firstCell = (row[0] || '').trim().toLowerCase();
      if (firstCell === 'available') { cutoffIndex = i; break; }

      TIERS.forEach((tier, idx) => {
        const base = idx * 6;
        const ign = (row[base] || '').trim();
        if (!ign) return;
        result[tier].push({
          ign,
          region: (row[base + 1] || '').trim(),
          strikes: (row[base + 2] || '').trim(),
          defenses: (row[base + 3] || '').trim(),
          discord: (row[base + 4] || '').trim(),
          peak: (row[base + 5] || '').trim(),
          isPending: false
        });
      });
    }

    // Buscar la fila "LT2 | Pending | ... | HT2 | Pending | ... | LT1 | Pending"
    const PENDING_TIERS = ['LT2', 'HT2', 'LT1'];
    let pendingHeaderIdx = -1;
    for (let i = cutoffIndex; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      if ((row[0] || '').trim() === 'LT2' && (row[1] || '').trim().toLowerCase() === 'pending') {
        pendingHeaderIdx = i;
        break;
      }
    }

    if (pendingHeaderIdx !== -1) {
      const pendingSets = { LT2: new Set(), HT2: new Set(), LT1: new Set() };
      // pendingHeaderIdx + 1 es la fila de encabezados (IGN, Region, Strikes...)
      for (let i = pendingHeaderIdx + 2; i < rows.length; i++) {
        const row = rows[i];
        if (!row) break;
        let anyData = false;
        PENDING_TIERS.forEach((tier, idx) => {
          const base = idx * 6;
          const ign = (row[base] || '').trim();
          if (!ign) return;
          anyData = true;
          const strikesNum = parseInt((row[base + 2] || '').trim(), 10);
          if (!isNaN(strikesNum) && strikesNum < 0) {
            pendingSets[tier].add(ign);
          }
        });
        if (!anyData) break;
      }

      PENDING_TIERS.forEach(tier => {
        result[tier].forEach(p => {
          if (pendingSets[tier].has(p.ign)) p.isPending = true;
        });
      });
    }

    // Buscar la fila "Priority | 1 | DiscordID | 2 | DiscordID" (se repite para LT2, HT2, LT1)
    const PRIORITY_TIERS = ['LT2', 'HT2', 'LT1'];
    let priorityHeaderIdx = -1;
    for (let i = cutoffIndex; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      if ((row[0] || '').trim() === 'Priority' && (row[1] || '').trim() === '1') {
        priorityHeaderIdx = i;
        break;
      }
    }

    const priorityRanks = { LT2: new Map(), HT2: new Map(), LT1: new Map() };
    if (priorityHeaderIdx !== -1) {
      for (let i = priorityHeaderIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) break;
        let anyData = false;
        PRIORITY_TIERS.forEach((tier, idx) => {
          const base = idx * 6;
          const regionCell = (row[base] || '').trim();
          if (!regionCell) return;
          anyData = true;
          const p1 = (row[base + 1] || '').trim();
          const p2 = (row[base + 3] || '').trim();
          if (p1 && p1 !== '#N/A') priorityRanks[tier].set(p1.toLowerCase(), 0);
          if (p2 && p2 !== '#N/A') priorityRanks[tier].set(p2.toLowerCase(), 1);
        });
        if (!anyData) break;
      }
    }

    TIERS.forEach(tier => {
      const ranks = priorityRanks[tier];
      result[tier].forEach(p => {
        const rank = ranks ? ranks.get(p.ign.toLowerCase()) : undefined;
        p.priorityRank = rank === undefined ? 2 : rank;
      });
    });

    // Tabla de "Testing" ubicada siempre en A47:E57 (filas 47 a 57, columna A = IGN).
    const testingSet = new Set();
    for (let i = 46; i <= 56 && i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      const ign = (row[0] || '').trim();
      if (ign) testingSet.add(ign.toLowerCase());
    }
    TIERS.forEach(tier => {
      result[tier].forEach(p => {
        p.isTesting = testingSet.has(p.ign.toLowerCase());
      });
    });

    return result;
  }

  function renderTiers(data) {
    container.innerHTML = '';
    TIERS.forEach(tier => {
      const col = document.createElement('div');
      col.className = 'tier-column';
      col.style.setProperty('--tier-color', TIER_COLOR_VARS[tier]);

      const header = document.createElement('div');
      header.className = 'tier-header';
      header.textContent = tier;
      col.appendChild(header);

      const players = data[tier].slice();
      players.forEach(p => { p.isLOA = loaSet.has(p.ign.toLowerCase()); });
      players.sort((a, b) => {
        const ra = regionRank(a.region);
        const rb = regionRank(b.region);
        if (ra !== rb) return ra - rb;

        const sa = (a.isPending || a.isLOA || a.isTesting) ? 1 : 0;
        const sb = (b.isPending || b.isLOA || b.isTesting) ? 1 : 0;
        if (sa !== sb) return sa - sb;

        if (sa === 0) {
          const pa = a.priorityRank ?? 2;
          const pb = b.priorityRank ?? 2;
          if (pa !== pb) return pa - pb;
        }

        // Para el resto (sin orden particular), un orden estable "al azar"
        // basado en el nombre, así no se reordena solo con cada refresco.
        return simpleHash(a.ign) - simpleHash(b.ign);
      });
      if (players.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-row';
        empty.textContent = 'No players';
        col.appendChild(empty);
      } else {
        players.forEach(p => {
          const region = (p.region || 'Unknown').toUpperCase();
          const regionStyle = REGION_STYLES[region] || { bg: 'var(--card)', text: 'var(--text-muted)' };
          const row = document.createElement('div');
          row.className = 'player-row' + (p.isPending ? ' status-pending' : '') + (p.isLOA ? ' status-loa' : '') + (p.isTesting ? ' status-testing' : '');
          row.innerHTML = `
            <img class="player-skin-banner" src="https://vzge.me/bust/400/${encodeURIComponent(p.ign)}" alt="" loading="lazy" onerror="this.remove()">
            <div class="player-main">
              <span>${escapeHtml(p.ign)}</span>
              ${p.peak ? '<span class="peak-badge">PEAK</span>' : ''}
            </div>
            <div class="player-meta">
              <span class="region-tag" style="background:${regionStyle.bg};color:${regionStyle.text};">${escapeHtml(region)}</span>
              <span>${escapeHtml(p.strikes || '0 / 8')} strikes</span>
              <span>${escapeHtml(p.defenses || '0')} def</span>
            </div>
            ${p.discord ? `<div class="player-id">ID: ${escapeHtml(p.discord)}</div>` : ''}
          `;
          col.appendChild(row);
        });
      }

      container.appendChild(col);
    });
  }

  async function fetchModeData(modeKey) {
    const res = await fetch(SHEETS[modeKey], { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    return parseSheet(text);
  }

  async function loadMode(modeKey) {
    currentMode = modeKey;
    container.innerHTML = '<p class="loading">Loading data...</p>';
    statusLine.textContent = '';
    try {
      const data = await fetchModeData(modeKey);
      renderTiers(data);
      statusLine.textContent = 'Last updated: ' + new Date().toLocaleTimeString('en-US');
    } catch (err) {
      container.innerHTML = '<p class="error">Couldn\'t load the data. Please try again in a moment.</p>';
      statusLine.textContent = '';
      console.error(err);
    }
  }

  // Refresco silencioso: actualiza los datos sobre la marcha, sin borrar
  // la pantalla ni mostrar el estado de "Loading..." (para que no parpadee).
  async function refreshCurrentMode() {
    try {
      const data = await fetchModeData(currentMode);
      renderTiers(data);
      statusLine.textContent = 'Last updated: ' + new Date().toLocaleTimeString('en-US');
    } catch (err) {
      console.error(err);
    }
  }

  document.querySelectorAll('.mode-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      localStorage.setItem('msm_active_mode', btn.dataset.mode);
      loadMode(btn.dataset.mode);
    });
  });

  // Marcar como activo el tab del modo restaurado (por si no es LT Mace).
  document.querySelectorAll('.mode-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === currentMode);
  });

  (async function init() {
    await refreshLOA();
    loadMode(currentMode);
  })();

  // Refresca los datos (y la lista de LOA) solos cada 60 segundos para que se
  // vea "en vivo", sin parpadear la pantalla completa.
  setInterval(() => {
    refreshLOA();
    refreshCurrentMode();
  }, 60000);
</script>
