<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mace Submodes – Menú principal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(0.23,1,0.32,1);--bg:#0c0d0f;--surface:#131417;--surface-2:#1a1b1f;--text:#eceef0;--muted:#a3a6ad;--accent:#cf9a4c;--border:rgba(255,255,255,0.09)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
.layout{display:flex;min-height:100vh}
.side{width:248px;flex:none;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--border);overflow:hidden;position:sticky;top:0;height:100vh;transition:width 260ms var(--ease)}
.layout.closed .side{width:72px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.lbl{white-space:nowrap;transition:opacity 180ms var(--ease)}
.layout.closed .lbl{opacity:0}
.brand{font-size:17px;font-weight:700;letter-spacing:.02em;color:var(--accent)}
.tog{flex:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:transform 160ms var(--ease),background-color 160ms ease}
.item{display:flex;align-items:center;gap:14px;height:46px;padding:0 13px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:500;border:1px solid transparent;transition:background-color 160ms ease,color 160ms ease,transform 160ms var(--ease)}
.item svg{flex:none}
.item.on{background:rgba(207,154,76,.14);color:var(--accent);border-color:rgba(207,154,76,.28)}
.item:active,.tog:active{transform:scale(.97)}
.item:focus-visible,.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover) and (pointer:fine){
.item:not(.on):hover{background:rgba(255,255,255,.045);color:var(--text)}
.tog:hover{background:var(--surface-2)}
}
main{flex:1;min-width:0;padding:72px 56px}
.intro{max-width:720px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--accent)}
h1{margin:0;font-size:52px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
p{margin:0;font-size:17px;line-height:1.6;color:var(--muted)}
@media (max-width:700px){.layout .side{width:72px}.layout:not(.closed) .side{width:220px}main{padding:48px 24px}h1{font-size:38px}}
@media (prefers-reduced-motion:reduce){.side,.item,.tog{transition-property:opacity,background-color,color,border-color}}
</style>
</head>
<body>
<div class="layout" id="layout">
  <nav class="side" aria-label="Menú principal">
    <div class="head">
      <button class="tog" id="tog" type="button" aria-label="Abrir o cerrar menú" aria-expanded="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="lbl brand">MACE SUBMODES</span>
    </div>
    <a class="item on" href="#rankings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span class="lbl">Rankings</span></a>
    <a class="item" href="#players"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg><span class="lbl">Players</span></a>
    <a class="item" href="https://discord.gg/heNJvkG76" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6c3-1 7-1 10 0l2 2 2 8c-2 2-4 3-6 3l-1-2h-4l-1 2c-2 0-4-1-6-3l2-8z"/><circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/></svg><span class="lbl">Discord</span></a>
    <a class="item" href="index_nuevo.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9l6-5 6 5v11M10 20v-6h4v6"/></svg><span class="lbl">LT2 Players</span></a>
  </nav>
  <main>
    <div class="intro">
      <span class="eyebrow">MENÚ PRINCIPAL</span>
      <h1>Mace Submodes</h1>
      <p>Rankings de jugadores por submodo, tiers y regiones. Elegí una sección en el menú o entrá directo desde acá.</p>
    </div>
  </main>
</div>
<script>
(function(){
  var l=document.getElementById('layout'),b=document.getElementById('tog');
  try{if(localStorage.getItem('menu')==='closed'){l.classList.add('closed');b.setAttribute('aria-expanded','false')}}catch(e){}
  b.addEventListener('click',function(){
    var c=l.classList.toggle('closed');
    b.setAttribute('aria-expanded',String(!c));
    try{localStorage.setItem('menu',c?'closed':'open')}catch(e){}
  });
})();
</script>
</body>
</html>
